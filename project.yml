name: Linger
options:
  bundleIdPrefix: com.michaelrigart
  deploymentTarget:
    macOS: "26.0"
packages:
  LingerCore:
    path: Packages/LingerCore
targets:
  Linger:
    type: application
    platform: macOS
    sources: [Linger]
    dependencies:
      - package: LingerCore
    info:
      path: Linger/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Linger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Linger/Linger.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelrigart.linger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: "0"
        DEVELOPMENT_TEAM: CX4MWR5579
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: dev
        SWIFT_VERSION: "6.0"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
